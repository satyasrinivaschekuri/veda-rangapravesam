<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // SPA redirect logic for GitHub Pages
    // Convert 404 to the appropriate route in the SPA
    var segment = "";
    var basePath = "/veda-rangapravesam";
    var currentPath = window.location.pathname;

    // Remove the base path if it exists
    if (currentPath.startsWith(basePath)) {
      segment = currentPath.substring(basePath.length);
    } else {
      segment = currentPath;
    }

    // Remove leading slash if present
    if (segment.startsWith("/")) {
      segment = segment.substring(1);
    }

    window.location.replace(
      basePath + "/" + (segment || "") + (window.location.search || "")
    );
  </script>
</head>
<body></body>
</html>
