<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // SPA redirect logic for GitHub Pages
    // When using a custom domain, the base path is "/" not "/repo-name"
    var basePath = window.location.hostname.endsWith("github.io") ? "/veda-rangapravesam" : "";
    var currentPath = window.location.pathname;

    var segment = currentPath;
    if (basePath && segment.startsWith(basePath)) {
      segment = segment.substring(basePath.length);
    }

    if (segment.startsWith("/")) {
      segment = segment.substring(1);
    }

    var redirectTo = basePath + "/" + (segment || "");
    redirectTo = redirectTo.replace(/\/+/g, "/");

    window.location.replace(redirectTo + (window.location.search || ""));
  </script>
</head>
<body></body>
</html>
