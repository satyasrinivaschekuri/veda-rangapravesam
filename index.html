  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing
      (function() {
        var p = new URLSearchParams(window.location.search).get("p");
        if (p) {
          var decoded = decodeURIComponent(p);
          // decoded is e.g. "/metrics?key=..." — split into pathname and search
          var qIdx = decoded.indexOf("?");
          var pathname = qIdx === -1 ? decoded : decoded.substring(0, qIdx);
          var search = qIdx === -1 ? "" : decoded.substring(qIdx);
          window.history.replaceState(null, "", pathname + search);
        }
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
