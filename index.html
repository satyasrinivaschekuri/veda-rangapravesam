  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing
      (function() {
        // p is the original path+search, still percent-encoded (e.g. /metrics?key=vR9%23mK2...)
        // Do NOT decode — pass the encoded string directly so %23 stays %23, not #
        var match = window.location.search.match(/[?&]p=([^&]*)/);
        if (match) {
          window.history.replaceState(null, "", match[1]);
        }
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
